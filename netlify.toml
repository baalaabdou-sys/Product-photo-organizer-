# The deployable app in this repository is the Abderrahmane Family Tree PWA,
# which lives in family-tree/. The Expo project at the repository root is an
# unrelated Android app and must not be built here — without this file Netlify
# auto-detects that root package.json and runs `expo export -p web`, which
# fails because the Expo app has no web target.

[build]
  base = "family-tree"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Icons are committed, so the native image toolchain is never needed here.
  NPM_FLAGS = "--no-audit --no-fund"

# The app keeps its view state in memory rather than in the URL, but a deep
# link or a refresh on any path should still land on the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from a stale cache, or an update
# can never reach an installed copy of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Build output is content-hashed, so it can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
