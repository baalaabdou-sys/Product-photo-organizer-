<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Abderrahmane Family Tree</title>
    <meta name="description" content="A living archive of the Abderrahmane family — generations, stories and photographs, preserved." />
    <meta name="theme-color" content="#f8f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171311" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Abderrahmane" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      /* micro-grain: generated once, felt not seen */
      :root {
        --grain-url: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");
      }
      /* first-paint ground so there is never a white flash */
      html { background: #f8f4ec; }
      @media (prefers-color-scheme: dark) { html { background: #171311; } }
    </style>
  </head>
  <body>
    <a class="sr-only skip-link" href="#main">Skip to main content</a>
    <div id="root"></div>
    <noscript>
      <div style="padding:48px;font-family:Georgia,serif;max-width:36rem;margin:0 auto">
        <h1 style="font-weight:300">Abderrahmane Family Tree</h1>
        <p>This family archive needs JavaScript enabled to draw the tree.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
